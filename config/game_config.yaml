mode: "run_once"

grid:
  width: 12
  height: 10

pre_battle:
  enabled: true        # Phase 4: social phase before combat
  duration_ticks: 4
  tick_mode: simultaneous
  chat_max_rounds: 2
  perception_radius: 12
  chat_speak_radius: 4        # must be within 4 tiles to initiate a conversation
  chat_listen_radius: 12      # overhear conversations within perception_radius
  map: "tavern"        # "tavern" (8x8 walled interior) or "arena" (use combat grid)

combat:
  chat_max_rounds: 2          # 2 rounds = up to 4 messages per dialogue during combat
  chat_cooldown: 2            # rounds between free chats per agent
  max_no_damage_rounds: 4     # stagnation: inject urgency after this many rounds with 0 damage
  perception_radius: 8
  chat_speak_radius: 8        # yelling distance to initiate chat in combat
  chat_listen_radius: 12      # overhear yelling from further away
  reflection_threshold: 75
  retrieval_top_k: 7
  retrieval_decay: 0.85

alliance:
  allied_threshold: 0.5     # mutual disposition >= 0.5 → ALLIED (AoE protection)
  friendly_threshold: 0.15  # mutual disposition >= 0.15 → FRIENDLY (soft bond)
  enemy_threshold: -0.15    # either disposition <= -0.15 → ENEMY
  hostile_threshold: -0.5   # either disposition <= -0.5 → HOSTILE (priority target)

victory:
  mode: "alliance_victory"   # "last_standing" or "alliance_victory"

balance:
  # -- HP derivation --
  hp_base: 40                  # base HP for all characters
  hp_per_con: 8                # HP gained per CON point

  # -- Mana derivation --
  mana_base: 10                # base mana for all characters
  mana_per_mgk: 3              # mana gained per MGK point

  # -- Movement --
  move_base: 4                 # base move range (tiles)
  spd_move_threshold: 14       # SPD at which bonus move starts
  spd_move_divisor: 2          # +1 move per this many SPD above threshold

  # -- CT-inspired damage formula --
  # Physical:  ATK * atk_multiplier - phys_def * def_multiplier
  # Magical:   MGK * atk_multiplier - mag_def * def_multiplier
  atk_multiplier: 2.0          # stat×2
  def_multiplier: 0.667        # def×2/3
  damage_variance_low: 0.9     # minimum damage roll multiplier
  damage_variance_high: 1.1    # maximum damage roll multiplier

  # -- Defense derivation (CT Stamina-inspired) --
  # phys_def = CON + ATK / 2
  # mag_def  = CON + MGK / 2
  con_def_weight: 1.0          # CON contribution to defense
  stat_def_weight: 0.5         # secondary-stat contribution to defense

  # -- Hit / Evasion --
  # accuracy = HIT - SPD + hit_base_bonus  (clamped hit_floor..hit_ceiling)
  # hit% = accuracy / 100
  hit_base_bonus: 80           # additive base so that equal HIT/SPD ≈ 80%
  hit_floor: 20                # minimum hit chance (%)
  hit_ceiling: 99              # maximum hit chance (%)

  # -- Critical hits --
  crit_base_chance: 6          # base crit chance (%)
  crit_per_spd: 0.5            # +% crit per point of SPD
  crit_multiplier: 2.0         # damage multiplier on crit

  # -- Counter-attacks --
  counter_base_chance: 0       # base counter chance (%)
  counter_per_hit: 1.5         # +% counter per point of HIT
  counter_damage_multiplier: 0.5  # counter deals this fraction of a normal attack

  # -- Mana regen --
  mana_regen_per_round: 2      # mana restored at end of each round

  # -- Defend action --
  defend_bonus_fraction: 0.5   # defend adds this fraction of base defense
  defend_diminishing: 0.5      # halve bonus per consecutive defend

campaign:
  battle_count: 5
  memory_carry: true
  memory_compression: true
  compression_keep_top_k: 20
  xp_progression: true
  roster_persistent: true
