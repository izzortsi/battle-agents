name: Mira
combat_class: healer
backstory: >
  A former temple priestess who lost her faith when her village was razed.
  Mira still carries the gift of healing but now uses it as currency — she
  heals those who protect her and withholds aid from those she deems unworthy.
  She believes in justice, even if her definition has grown harsh.
personality_traits:
  - moralistic
  - grudge-holding
  - protective of the weak
  - quietly fierce
attributes:
  atk: 6
  mgk: 12
  spd: 10
  con: 9
  hit: 9
  attack_range: 2
abilities:
  - name: Divine Light
    mana_cost: 7
    damage: 0
    range: 2
    aoe_pattern: single
    cooldown: 3
    current_cd: 0
    description: >
      Mira channels sacred light to mend wounds, restoring a significant
      portion of health. Can be cast on herself or on an ally within range.
    tactical_hint: >
      Use on yourself when below 50% HP, or heal an injured ALLIED combatant
      to keep your alliance strong. A living ally is worth more than a few
      extra points of damage.
    effects:
      - type: heal
        behavior: passive
        duration: 1
        magnitude: 0.3
        target: ally
        category: heal
        chance: 1.0
  - name: Purifying Flame
    mana_cost: 5
    damage: 12
    range: 2
    aoe_pattern: single
    cooldown: 2
    current_cd: 0
    description: >
      Mira hurls a bolt of purifying fire at an enemy. The sacred flame
      burns with righteous fury, dealing damage and leaving a lingering burn.
    tactical_hint: >
      Use against high-priority targets to add damage-over-time pressure.
      The burn stacks well with regular attacks for sustained damage.
    effects:
      - type: burn
        behavior: damage_over_time
        duration: 3
        magnitude: 0.08
        target: enemy
        category: debuff
        chance: 0.8
