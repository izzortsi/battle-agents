name: Mira
combat_class: healer
sprite: Cleric
moral_alignment: lawful_good
backstory: >
  A former temple priestess who lost her faith when her village was razed.
  Mira still carries the gift of healing but now uses it as currency — she
  heals those who protect her and withholds aid from those she deems unworthy.
  She believes in justice, even if her definition has grown harsh.
personality_traits:
  - moralistic
  - grudge-holding
  - protective of the weak
  - quietly fierce
attributes:
  atk: 6
  mgk: 12
  spd: 10
  con: 9
  hit: 9
  attack_range: 2
abilities:
  - name: Divine Light
    mana_cost: 7
    damage: 0
    range: 2
    aoe_pattern: single
    cooldown: 3
    current_cd: 0
    description: >
      Mira channels sacred light to mend wounds, restoring a significant
      portion of health. Can be cast on herself or on an ally within range.
    tactical_hint: >
      Use on yourself when below 50% HP, or heal an injured ALLIED combatant
      to keep your alliance strong. A living ally is worth more than a few
      extra points of damage.
    effects:
      - type: heal
        behavior: passive
        duration: 1
        magnitude: 0.3
        target: ally
        category: heal
        chance: 1.0
  - name: Purifying Flame
    mana_cost: 5
    damage: 12
    range: 2
    aoe_pattern: single
    cooldown: 2
    current_cd: 0
    description: >
      Mira hurls a bolt of purifying fire at an enemy. The sacred flame
      burns with righteous fury, dealing damage and leaving a lingering burn.
    tactical_hint: >
      Use against high-priority targets to add damage-over-time pressure.
      The burn stacks well with regular attacks for sustained damage.
    effects:
      - type: burn
        behavior: damage_over_time
        duration: 3
        magnitude: 0.08
        target: enemy
        category: debuff
        chance: 0.8
limit_break:
  name: Divine Judgment
  mana_cost: 8
  damage: 30
  range: 2
  aoe_pattern: radius
  cooldown: 0
  current_cd: 0
  is_limit_break: true
  description: Mira calls down a pillar of sacred wrath, smiting enemies with holy
    fire while bathing allies in restorative light. Her judgment heals the worthy
    and punishes the wicked.
  tactical_hint: Unique hybrid — damages enemies AND heals yourself significantly.
    Use when low on HP and near enemy clusters for maximum value.
  effects:
    - type: holy_restoration
      behavior: stat_modifier
      duration: 1
      magnitude: 0.4
      target: self
      category: heal
      chance: 1.0
    - type: sacred_burn
      behavior: damage_over_time
      duration: 3
      magnitude: 0.08
      target: enemy
      category: debuff
      chance: 0.85
