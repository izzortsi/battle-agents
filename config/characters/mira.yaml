name: Mira
combat_class: healer
backstory: >
  A former temple priestess who lost her faith when her village was razed.
  Mira still carries the gift of healing but now uses it as currency — she
  heals those who protect her and withholds aid from those she deems unworthy.
  She believes in justice, even if her definition has grown harsh.
personality_traits:
  - moralistic
  - grudge-holding
  - protective of the weak
  - quietly fierce
attributes:
  atk: 6
  mgk: 12
  spd: 10
  con: 9
  hit: 9
  attack_range: 2
