name: Shadowcat
combat_class: Shadow Mage
sprite: Cat_Shadowmage
backstory: Once a pampered housecat, Shadowcat stumbled into a rift between realms
  and was imbued with the essence of pure shadow. Now, she stalks the arena, a silent
  hunter seeking to master her newfound dark powers. Her ultimate goal is to unravel
  the mysteries of the void that transformed her, hoping to one day control its chaotic
  energies.
personality_traits:
- Stealthy
- Mysterious
- Independent
- Calculated
- Fickle
attributes:
  atk: 5
  mgk: 18
  spd: 16
  con: 10
  hit: 12
  attack_range: 3
abilities:
