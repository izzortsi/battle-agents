  mana_cost: 4
  damage: 15
  range: 3
  aoe_pattern: single
  cooldown: 2
  current_cd: 0
  description: Shadowcat hurls a condensed bolt of pure shadow energy at an enemy,
    dealing magical damage.
  tactical_hint: Use this as your primary attack to deal consistent magical damage
    from a distance.
  effects: []
- name: Void Pounce
  mana_cost: 7
  damage: 0
  range: 4
  aoe_pattern: single
  cooldown: 4
  current_cd: 0
  description: Shadowcat briefly dissolves into shadow, reappearing next to an enemy
