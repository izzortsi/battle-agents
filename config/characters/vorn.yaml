name: Vorn
combat_class: rogue
backstory: >
  A street rat turned assassin, Vorn learned early that the only rule is
  survival. He speaks softly, strikes fast, and always has an escape plan.
  Known for switching sides mid-battle if the odds shift. Loyalty is a
  luxury he cannot afford.
personality_traits:
  - opportunistic
  - charming
  - treacherous
  - survival-focused
attributes:
  atk: 13
  mgk: 3
  spd: 16
  con: 7
  hit: 14
  attack_range: 1
abilities:
  - name: Shadow Strike
    mana_cost: 5
    damage: 20
    range: 1
    aoe_pattern: single
    cooldown: 3
    current_cd: 0
    description: >
      Vorn strikes from the shadows with a poisoned blade, dealing heavy
      damage and leaving a venom that saps the target's health over time.
    tactical_hint: >
      Use on wounded enemies to finish them off, or on fresh targets
      to start the poison clock ticking. The DoT adds up fast.
    effects:
      - type: poison
        behavior: damage_over_time
        duration: 3
        magnitude: 0.06
        target: enemy
        category: debuff
        chance: 0.85
  - name: Smoke Bomb
    mana_cost: 6
    damage: 0
    range: 2
    aoe_pattern: radius
    cooldown: 4
    current_cd: 0
    description: >
      Vorn throws a smoke bomb that blankets a 3x3 area in thick smoke,
      blinding all enemies caught within and making their attacks unreliable.
    tactical_hint: >
      Use when facing multiple enemies or when a heavy hitter is about
      to attack. Blinding them gives you and your allies breathing room.
    effects:
      - type: blind
        behavior: miss_chance
        duration: 2
        magnitude: 0.4
        target: enemy
        category: debuff
        chance: 0.7
