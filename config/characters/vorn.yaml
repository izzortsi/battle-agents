name: Vorn
combat_class: rogue
backstory: >
  A street rat turned assassin, Vorn learned early that the only rule is
  survival. He speaks softly, strikes fast, and always has an escape plan.
  Known for switching sides mid-battle if the odds shift. Loyalty is a
  luxury he cannot afford.
personality_traits:
  - opportunistic
  - charming
  - treacherous
  - survival-focused
attributes:
  atk: 13
  mgk: 3
  spd: 16
  con: 7
  hit: 14
  attack_range: 1
