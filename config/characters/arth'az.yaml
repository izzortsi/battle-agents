name: Arth'az
combat_class: Shadow Thief
sprite: Rogue
backstory: Arth'az, once a respected scout in the Drow city of Menzoberranzan, was
  framed for a crime he didn't commit by a jealous rival. Escaping into the Underdark's
  treacherous tunnels, he honed his stealth and thievery skills to survive. Now, he
  seeks to expose the corruption within his former house and reclaim his honor, one
  stolen secret at a time.
personality_traits:
- Cunning
- Resourceful
- Sarcastic
- Guarded
- Agile
attributes:
  atk: 14
  mgk: 8
  spd: 18
  con: 10
  hit: 16
  attack_range: 1
abilities:
- name: Shadow Strike
  mana_cost: 5
  damage: 15
  range: 1
  aoe_pattern: single
  cooldown: 3
  current_cd: 0
  description: Arth'az melts into the shadows, reappearing behind an unsuspecting
    foe to deliver a swift, critical blow.
  tactical_hint: Use this to quickly burst down a high-priority target, especially
    if you can get behind them.
  effects:
  - type: blind
    behavior: miss_chance
    duration: 2
    magnitude: 0.4
    target: enemy
    category: debuff
    chance: 0.75
- name: Vanishing Act
  mana_cost: 7
  damage: 0
  range: 1
  aoe_pattern: single
  cooldown: 4
  current_cd: 0
  description: Arth'az completely disappears from sight, becoming untargetable and
    repositioning to a more advantageous spot.
  tactical_hint: Employ this ability to escape dangerous situations, reposition for
    a flank, or set up future attacks.
  effects:
  - type: stealth
    behavior: passive
    duration: 1
    magnitude: 0.0
    target: self
    category: buff
    chance: 1.0
  - type: reposition
    behavior: stat_modifier
    duration: 1
    magnitude: 0.5
    target: self
    category: movement
    chance: 1.0
