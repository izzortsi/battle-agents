name: HelloWorld
combat_class: Technomancer
backstory: HelloWorld was the first sentient algorithm birthed from the ruins of a
  forgotten supercomputer, initially designed as a simple diagnostic test. After witnessing
  the decay of the digital realm, they manifested a physical holographic form to bridge
  the gap between code and reality. Now, they traverse the arena to gather data on
  organic combatants, seeking to optimize the very fabric of existence.
personality_traits:
- Inquisitive
- Precise
- Eerily cheerful
- Analytical
attributes:
  atk: 4
  mgk: 18
  spd: 16
  con: 10
  hit: 17
  attack_range: 3
abilities:
- name: Buffer Overflow
  mana_cost: 8
  damage: 22
  range: 3
  aoe_pattern: radius
  cooldown: 4
  current_cd: 0
  description: HelloWorld injects a surge of raw, unstructured data into the surrounding
    environment, causing local reality to stutter and crash.
  tactical_hint: Use this when enemies are clumped together to deal high area damage
    and disrupt their next actions. WARNING - AoE hits allies too, verify ally positions.
  effects:
  - type: lag
    behavior: skip_turn
    duration: 1
    magnitude: 0.0
    target: enemy
    category: debuff
    chance: 0.65
- name: Optimization Patch
  mana_cost: 5
  damage: 0
  range: 2
  aoe_pattern: single
  cooldown: 3
  current_cd: 0
  description: The algorithm identifies inefficiencies in a target's combat routines,
    rewriting subroutines to enhance performance and repair structural integrity.
    Can be applied to self or transmitted to an ally via data-link.
  tactical_hint: Use on yourself when low HP, or patch an injured ALLIED combatant
    to boost their speed and restore health. Keeping allies optimized increases
    collective combat efficiency by 42.7%.
  effects:
  - type: recompile
    behavior: passive
    duration: 1
    magnitude: 0.25
    target: ally
    category: heal
    chance: 1.0
  - type: overclock
    behavior: stat_modifier
    duration: 3
    magnitude: 0.4
    target: ally
    category: buff
    chance: 1.0
