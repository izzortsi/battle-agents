<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battle-Agents</title>
  <link rel="stylesheet" href="/static/css/layout.css?v=28">
  <link rel="stylesheet" href="/static/css/landing.css?v=28">
  <link rel="stylesheet" href="/static/css/sprites.css?v=28">
  <link rel="stylesheet" href="/static/css/animations.css?v=28">
</head>
<body>
  <!-- Header -->
  <header id="header">
    <div class="header-left">
      <span class="logo">Battle-Agents</span>
      <span id="phase-badge" class="badge">IDLE</span>
      <span id="round-badge" class="badge badge-dim">Round —</span>
      <button id="btn-lore" class="btn-lore hidden" title="View world lore">Lore</button>
    </div>
    <div class="header-controls">
      <button id="btn-start" title="Start simulation" style="display:none">Start</button>
      <button id="btn-step" title="Advance one turn" disabled>Step</button>
      <button id="btn-play" title="Auto-advance" disabled>Play</button>
      <button id="btn-pause" title="Pause" disabled>Pause</button>
      <label class="speed-label">
        Speed
        <input type="range" id="speed-slider" min="50" max="2000" value="500" step="50">
        <span id="speed-value">500ms</span>
      </label>
    </div>
  </header>

  <!-- Landing page (shown first) -->
  <div id="landing-page"></div>

  <!-- Main battle layout (hidden until battle starts) -->
  <main id="main" class="hidden">
    <!-- Left panel: Agent cards -->
    <aside id="panel-agents" class="panel">
      <h2>Agents</h2>
      <div id="agent-cards"></div>
    </aside>

    <!-- Actions panel (player controls) -->
    <aside id="panel-actions" class="panel">
      <h2>Actions</h2>
      <div id="actions-content">
        <!-- Player action panel (shown only when backend requests input) -->
        <div id="player-action-overlay" class="hidden">
          <div id="player-action-title" class="player-action-title">Your Turn</div>
          <div class="player-action-buttons">
            <button id="btn-act-move" class="btn-mini">Move</button>
            <button id="btn-act-attack" class="btn-mini">Attack</button>
            <button id="btn-act-abilities" class="btn-mini">Abilities</button>
            <button id="btn-act-chat" class="btn-mini">Chat</button>
            <button id="btn-act-defend" class="btn-mini">Defend</button>
            <button id="btn-act-wait" class="btn-mini">Wait</button>
          </div>
          <div id="player-action-hint" class="player-action-hint"></div>
          <div id="player-chat-row" class="player-chat-row hidden">
            <input id="player-chat-input" type="text" maxlength="500" placeholder="Say something..." />
          </div>
          <div id="ability-list" class="ability-list hidden"></div>
        </div>
      </div>
    </aside>

    <!-- Commentary banner (above arena) -->
    <div id="panel-commentary">
      <div id="commentary-text"></div>
    </div>

    <!-- Center: Isometric canvas (replaces SVG grid) -->
    <section id="panel-grid" class="panel">
      <canvas id="battle-grid"></canvas>
    </section>

    <!-- Right panel: Battle log -->
    <section id="panel-log" class="panel">
      <h2>Battle Log</h2>
      <div id="log-content"></div>
    </section>

    <!-- Bottom: Dialogue -->
    <section id="panel-dialogue" class="panel">
      <h2>Dialogue</h2>
      <div id="dialogue-content"></div>
    </section>

    <!-- Resize handles -->
    <div id="resize-right" class="resize-handle resize-handle-v"
         style="grid-column:4; grid-row:1/3"></div>
    <div id="resize-bottom" class="resize-handle resize-handle-h"
         style="grid-column:1/-1; grid-row:3"></div>

    <!-- Dialogue detail popup (hidden by default) -->
    <div id="dialogue-popup" class="agent-popup hidden">
      <div class="agent-popup-panel dialogue-popup-panel">
        <button class="agent-popup-close" id="dialogue-popup-close">&times;</button>
        <div class="agent-popup-tabs">
          <button class="agent-popup-tab active">Dialogue</button>
        </div>
        <div class="agent-popup-body">
          <div class="agent-popup-content active" id="popup-dialogue-detail"></div>
        </div>
      </div>
    </div>

    <!-- Lore popup modal (hidden by default) -->
    <div id="lore-popup" class="agent-popup hidden">
      <div class="agent-popup-panel lore-popup-panel">
        <button class="agent-popup-close" id="lore-popup-close">&times;</button>
        <div class="agent-popup-tabs">
          <button class="agent-popup-tab active">World Lore</button>
        </div>
        <div class="agent-popup-body">
          <div class="agent-popup-content active" id="popup-lore"></div>
        </div>
      </div>
    </div>

    <!-- Agent popup modal (hidden by default) -->
    <div id="agent-popup" class="agent-popup hidden">
      <div class="agent-popup-panel">
        <button class="agent-popup-close" id="agent-popup-close">&times;</button>
        <div class="agent-popup-tabs">
          <button class="agent-popup-tab active" data-tab="character">Character</button>
          <button class="agent-popup-tab" data-tab="social">Social</button>
          <button class="agent-popup-tab" data-tab="mind">Mind</button>
        </div>
        <div class="agent-popup-body">
          <div class="agent-popup-content active" id="popup-character"></div>
          <div class="agent-popup-content" id="popup-social"></div>
          <div class="agent-popup-content" id="popup-mind"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="/static/js/constants.js?v=28"></script>
  <script src="/static/js/state.js?v=28"></script>
  <script src="/static/js/sprites.js?v=28"></script>
  <script src="/static/js/panels.js?v=28"></script>
  <script src="/static/js/isometric_renderer.js?v=2"></script>
  <script src="/static/js/renderer.js?v=28"></script>
  <script src="/static/js/resizer.js?v=28"></script>
  <script src="/static/js/landing.js?v=28"></script>
  <script src="/static/js/main.js?v=28"></script>
  <script src="/static/js/player_input.js?v=2"></script>
</body>
</html>
